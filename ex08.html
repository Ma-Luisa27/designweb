<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 08</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ count: 0 }" class="ml-2">
        <button x-on:click="count--" class="p-2 bg-gray-200 rounded m-2">-</button>
        <span x-text="count"></span>
        <button x-on:click="count++" class="p-2 bg-gray-200 rounded m-2">+</button>
        <button x-on:click="count = 0" class="p-2 bg-gray-200 rounded m-2">Reset</button>
    </div>
</body>
</html>
