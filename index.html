<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 11</title>
    <!-- O 'defer' faz carregar depois do HTML -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div x-data="{nome : 'Webeti'}">
        <h1>
            Olá, <span x-text='nome'></span>
        </h1>
    </div>

    <div x-data="{ aceso: false }">
        <button @click="aceso = !aceso">
            Interruptor
        </button>
  
    Status da Luz: <span x-text="aceso ? '💡' : '🌑'"></span>

    <div x-data="{msg : ''}">
        <input x-model="msg" placeholder="Digite aqui...">
        <p>
            Você digitou: <span x-text="msg"></span>
        </p>
    </div>

    <div x-data="{n1: 0, n2: 0}">
        <input type="number" x-model="n1">
        +
        <input type="number" x-model="n2">
        <hr>
        <span
        x-text="parseInt(n1) + parseInt(n2)"
        :class = "{
            'text-red-500' : parseInt(n1) + parseInt(n2) > 10,
            'text-blue-500' : parseInt(n1) + parseInt(n2) <= 10
        }"
        ></span>
    </div>
</div>
</body>
</html>
