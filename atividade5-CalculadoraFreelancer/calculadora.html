<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Freelancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body x-data="{servicos: [], novoServico: '', novoValor: 0, get total() {let count = 0; this.servicos.forEach(item => count += item.valor); return count;}}">
    <div>
        <div></div>
        <h5>Orçamento #001</h5>
    </div>
    <div>
        <input type="text" placeholder="Serviço..." x-model="novoServico">
        <input type="text" placeholder="Valor..." x-model.number="novoValor">
        <button @click="if (!novoServico || !novoValor) return; servicos.push({nome: novoServico, valor: novoValor}); novoServico=''; novoValor=0;">..</button>
    </div>
    <ul>
        <template x-for="item in servicos">
            <li>
                <p x-text="item.nome"></p>
                <p x-text="item.valor"></p>
            </li>
        </template>
    </ul>
    <div>
        <p>Total</p>
        <span x-text="total"></span>
    </div>
</body>
</html>
