<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ mudar: 1}" class="ml-2">
        <p x-show="mudar === 1" class="text-green-600">Verde</p>
        <p x-show="mudar === 2" class="text-yellow-600">Amarelo</p>
        <p x-show="mudar === 3" class="text-red-600">Vermelho</p>
        <button @click="if (mudar === 3) {mudar = 1} else {mudar++}" class="p-2 mt-2 bg-gray-200 rounded">Mudar</button>
    </div>
</body>
</html>
