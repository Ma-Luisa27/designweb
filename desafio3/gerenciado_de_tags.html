<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ tags: ['HTML'], newTag: '' }">
        <!-- push serve para inserir um item na lista -->
        <input x-model="newTag" @keydown.enter="tags.push(newTag); newTag=''">
        <!-- lista os itens em uma lista de dados composto por manipulação -->
        <template x-for="tag in tags">
            <span class="badge">
                <span x-text="tag"></span>
                <button @click="tags = tags.filter(t => t !== tag)">X</button>
            </span>
        </template>
    </div>
</div>
</body>
</html>
