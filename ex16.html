<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{tab: 0}">
    <div class="grid grid-cols-1 justify-items-center">
    <button @click="tab = 1" class="p-2 bg-gray-200 rounded w-[100%] m-2">Tab 1</button>
    <div x-show="tab === 1">Esta é uma mensagem da div 1</div>
    <button @click="tab = 2" class="p-2 bg-gray-200 rounded w-[100%] m-2">Tab 2</button>
    <div x-show="tab === 2">Esta é uma mensagem da div 2</div>
    <button @click="tab = 3" class="p-2 bg-gray-200 rounded w-[100%] m-2">Tab 3</button>
    <div x-show="tab === 3">Esta é uma mensagem da div 3</div>
    </div>
    </div>
</body>
</html>
