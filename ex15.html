<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 15</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ curtido: false , count: 0}" class="ml-2 mt-2 flex items-center ">
        <button @click="curtido = !curtido" x-text="curtido ? '❤️' : '🤍'" class="p-2 bg-gray-200 rounded"></button>
        <p @click="curtido = !curtido" x-text="curtido ? count-- : count++" class="ml-2 text-xl"></p>
    </div>
</body>
</html>
