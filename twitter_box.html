<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Box</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- 1. O CÉREBRO (Estado Inicial) -->
<div x-data="{ texto: '' }">

  <!-- 2. A CONEXÃO (Input <-> Var) -->
  <textarea x-model="texto"></textarea>

  <div>
    <!-- 3. O FEEDBACK (Texto e Cor) -->
    <span 
      x-text="texto.length + '/20'"
      :class="texto.length > 20 
              ? 'text-red-600' 
              : 'text-gray-400'">
    </span>

    <!-- 4. O GUARDA (Bloqueio) -->
    <button 
      :disabled="texto.length === 0 || 
                 texto.length > 20">
      Tweetar
    </button>
  </div>

</div>
</body>
</html>
