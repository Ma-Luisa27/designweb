<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ aberto: false }" class="ml-2 mt-2">
        <button @click="aberto = true" class="py-2 bg-gray-200 rounded w-[100px]">Abrir modal</button>
        <div class="grid place-items-center justify-items-center h-[80vh]">
        <div x-show="aberto" class="w-[300px] h-[200px] bg-gray-600 rounded grid place-items-center justify-items-center">
        <button @click="aberto = false" class="py-2 bg-gray-200 rounded w-[100px] bg-white">Fechar</button>
        </div>
        </div>
    </div>
</body>
</html>
